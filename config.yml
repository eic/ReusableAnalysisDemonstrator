# ============================================================================= 
# @file    config.yml
# @authors Derek Anderson (derek.murphy.anderson@protonmail.com)
# -----------------------------------------------------------------------------
# @brief Snakemake config. Defines global parameters that
#   can be overwritten at runtime. 
# =============================================================================

# generated output datacard
output_card:
  "out/output.yml"

# template datacard for output
template:
  "template.yml"

# name of list to dump input
# files into
input_list:
  "run/input.list"

# name of snakemake file
# to dump rules into
rules_file:
  "run/rules.smk"

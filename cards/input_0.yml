# @brief An input data card. Intended to mock up
#   data card of a possible dataset for analysis.
#   Includes NC DIS samples in different Q2
#   bins.
# ===============================================

# list of samples in dataset, could be one (for
#   a single dataset from a campaign) or many
#   (for a specific analysis)
datasets:

  # each one consists of:
  #   - an identifier (e.g. a rucio DID for
  #     campaign datasets) or a list of files
  #   - an optional human-readable description
  #   - and an optional protocol, which tells
  #     cardio how to get the files (defaults
  #     to rucio)
  - identifier:
      "epic:/RECO/26.07.1/epic_craterlake/DIS/pythia8.316-1.0/NC/noRad/ep/10x100/q2_1to10"
    description:
      "26.07.1 NC DIS sample with Q^2 = 1 - 10 GeV^2 generated by Pythia8.316"
    protocol:
      "rucio"

  - identifier:
      "epic:/RECO/26.07.1/epic_craterlake/DIS/pythia8.316-1.0/NC/noRad/ep/10x100/q2_10to100"
    description:
      "26.07.1 NC DIS sample with Q^2 = 10 - 100 GeV^2 generated by Pythia8.316"

# @brief An input data card. Intended to mock up
#   data card of a possible dataset for analysis.
#   Includes a single NC DIS sample.
# ===============================================

# list of samples in dataset, could be one (for
#   a single dataset from a campaign) or many
#   (for a specific analysis)
datasets:

  # each one consists of an identifier (e.g. a
  #   rucio DID for campaign datasets) or a list
  #   of files, and an optional human-readable
  #   description
  - identifier:
      "epic:/RECO/26.07.1/epic_craterlake/DIS/pythia8.316-1.0/NC/noRad/ep/10x100/q2_100to1000"
    description:
      "26.07.1 NC DIS sample with Q^2 = 100 - 1000 GeV^2 generated by Pythia8.316"

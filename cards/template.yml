# ===============================================
# @file    template.yml
# @authors Derek Anderson
#          (derek.murphy.anderson@protonmail.com)
# -----------------------------------------------
# @brief Template data card. Cardio processes
#   this when generating output data cards.
#   Information such as GitHub, Inputs, etc.
#   are copied into the output data card.
# ===============================================

# analysis identifiers/description: some unique
#   ID of output dataset (likely will vary based
#   on use) and human readable description
#   - publication data might want to make use
#     of an associated DOI or something
#   - validation data would want to have
#     something that ties it to the campaign
#     or pipeline it's for
identifier:
  "epic:reusable_analysis_demo:output"

description:
  "Jet validation plots for resuable analysis demonstration"

# inputs: pointers back to relevant data cards
#   being used as input for analysis.
#   - a card might represent either a single
#     sample/dataset (e.g. campaign output) or
#     multiple (e.g. for a specific analysis)
#   - datasets can be listed directly here
#     as well
inputs:
  - "./cards/input_0.yml" # NOTE the relative path!
  - "./cards/input_1.yml"

# location: where files are stored,
#   cardio will append all files
#   in this location to the output
#   card
location: "./out"

# eic-shell details:
#   - container and version should
#     be specified
#   - cardio has utilities to help
#     automate pulling and running
#     specific versions
eic_shell:
  container: eic_xl
  version: 26.10.0-stable

# workflow to produce data, this
#   should describe basic steps
#   needed to recreate the data
#   as a snakemake workflow
#   - NOTE worfkflow will be copied
#     directly into a snakemake
#     file
#   - NOTE configuration variables
#     will be configurable at runtime
configuration: |
  run_dir:
    "run"
  hist_out:
    "out"
  plot_out:
    "out/plot"
  suffix:
    "demo"
  nevent:
    100
  nfiles:
    -1
workflow: |
  rule make_hists:
      input:
          list = f"{config['run_dir']}/input.list",
      output:
          hist = f"{config['hist_out']}/output.root",
      shell:
          "root -b -q analysis/MakeJetValidationHists.C\'(\"{output.hist}\", \"{input.list}\", {config[nfiles]}, {config[nevent]})\'"

  rule make_plots:
      input:
          hist = f"{config['hist_out']}/output.root",
      output:
          plot = f"{config['plot_out']}/matchedJetResolutionVsEta.{config['suffix']}.png"
      params:
          path = f"{config['plot_out']}",
          suff = f"{config['suffix']}",
      shell:
          "root -b -q analysis/MakeJetValidationPlots.C\'(\"{params.path}\", \"{params.suff}\", \"{input.hist}\")\'"

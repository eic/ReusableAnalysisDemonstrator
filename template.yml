# ===============================================
# @file    template.yml
# @authors Derek Anderson
#          (derek.murphy.anderson@protonmail.com)
# -----------------------------------------------
# @brief Template datacard. Cardio processes
#   this when generating output datacards.
#   Information such as GitHub, Inputs, etc.
#   are copied into the output datacard.
# ===============================================

# analysis descriptors likely will vary based
# on purpose
#   - publication data might want to make use
#     of an associated DOI or something
#   - validation data would want to have
#     something that ties it to the campaign
#     or pipeline it's for
identifier: "epic:reusable_analysis_demo:output"

description: "Jet validation plots for resuable analysis demonstration"

# inputs point back to relevant datacards,
#   using them as stand-ins for either
#   individual files or entire datasets
input: "./input.yml"

# location where files are stored,
#   cardio will append all files
#   in this location to the output
#   card
location: "./out"

# workflow to produce data, this
#   should describe basic steps
#   needed to recreate the data
#   as a snakemake workflow
#   - NOTE worfkflow will be copied
#     directly into a snakemake
#     file
#   - NOTE configuration variables
#     will be configurable at runtime
configuration: |
  run_dir:
    "run"
  hist_out:
    "out"
  plot_out:
    "out/plot"
  suffix:
    "demo"
workflow: |
  rule make_hists:
      input:
          list = f"{config['run_dir']}/input.list",
      output:
          hist = f"{config['hist_out']}/output.root",
      params:
          nfile  = 1000,
          nevent = -1,
      shell:
          "root -b -q analysis/MakeJetValidationHists.C\'(\"{output.hist}\", \"{input.list}\", {params.nfile}, {params.nevent})\'"

  rule make_plots:
      input:
          hist = f"{config['hist_out']}/output.root",
      output:
          plot = f"{config['plot_out']}/matchedJetResolutionVsEta.{config['suffix']}.png"
      params:
          path = f"{config['plot_out']}",
          suff = f"{config['suffix']}",
      shell:
          "root -b -q analysis/MakeJetValidationPlots.C\'(\"{params.path}\", \"{params.suff}\", \"{input.hist}\")\'"
